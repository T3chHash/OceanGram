<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="oceanDeep" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>
    <linearGradient id="waveGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#oceanDeep)"/>
  
  <!-- Outer ring highlight -->
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#7dd3fc" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Water Wave Swells -->
  <path d="M64 340C120 310 180 370 256 340C332 310 390 350 448 330C430 420 350 460 256 460C162 460 84 410 64 340Z" fill="url(#waveGlow)" fill-opacity="0.35"/>
  <path d="M80 300C140 260 200 320 280 290C340 265 390 295 432 280C420 330 380 370 320 360C250 350 200 380 140 370C110 365 90 330 80 300Z" fill="#38bdf8" fill-opacity="0.45"/>

  <!-- Paper Messenger / Ocean Crest Origami -->
  <g filter="url(#glowEffect)">
    <path d="M130 250L400 120L300 390L240 290L130 250Z" fill="#ffffff"/>
    <path d="M240 290L400 120L270 260L240 290Z" fill="#bae6fd"/>
    <path d="M240 290L275 340L300 390L270 320L240 290Z" fill="#7dd3fc"/>
  </g>
</svg>
