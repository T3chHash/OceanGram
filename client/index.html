<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070a13" />
    <meta name="description" content="OceanGram - Fast, secure, real-time messenger with Telegram-grade fluidity, voice & video calls." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OceanGram" />
    <meta property="og:description" content="Modern real-time communication platform" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OceanGram" />
    <meta name="twitter:description" content="Modern real-time communication platform" />
    <meta name="twitter:image" content="/og-image.png" />
    <style>
      html,
      body {
        background: #f8fafc;
      }
      html.dark,
      html.dark body,
      html.sb-preload-dark,
      html.sb-preload-dark body {
        background: #070a13;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("oceangram-theme") || localStorage.getItem("songbird-theme");
          var isDark = stored ? stored === "dark" : true;
          if (isDark) {
            var root = document.documentElement;
            root.classList.add("dark", "sb-preload-dark");
            root.style.colorScheme = "dark";
            root.style.backgroundColor = "#070a13";
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#070a13");
          } else {
            var root = document.documentElement;
            root.classList.remove("dark", "sb-preload-dark");
            root.style.colorScheme = "light";
            root.style.backgroundColor = "#f8fafc";
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#f8fafc");
          }
        } catch (_) {}
      })();
    </script>
    <title>OceanGram</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
