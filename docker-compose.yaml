services:
  oceangram:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OCEANGRAM_IMAGE:-oceangram:latest}
    container_name: oceangram
    restart: unless-stopped
    expose:
      - "${SERVER_PORT:-5174}"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: ${SERVER_PORT:-5174}
      BIND_ADDRESS: "0.0.0.0"
      DB_CLIENT: ${DB_CLIENT:-sqlite3}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-oceangram}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Container name for Docker API control
      SONGBIRD_CONTAINER_NAME: ${OCEANGRAM_CONTAINER_NAME:-oceangram}
      OCEANGRAM_CONTAINER_NAME: ${OCEANGRAM_CONTAINER_NAME:-oceangram}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      WORKER_PORT: ${WORKER_PORT:-8080}
      STORAGE_PROCESSING_MODE: ${STORAGE_PROCESSING_MODE:-auto}
      WORKER_URL: ${WORKER_URL:-${MEDIA_WORKER_URL:-}}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      - oceangram-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:alpine
    container_name: oceangram-nginx
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-443}:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./certs/key.pem:/etc/nginx/certs/key.pem:ro
    depends_on:
      - oceangram

volumes:
  oceangram-data:
